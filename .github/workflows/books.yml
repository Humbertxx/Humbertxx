name: Update currently reading

on:
  schedule:
    # Once a day, 07:00 UTC. Keeps bot commits off the contribution graph's hourly churn.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      USER_ID: ${{ secrets.USER_ID }}
      SHELF: ${{ secrets.SHELF }}

    steps:
      - uses: actions/checkout@v4

      - name: Refresh shelf
        run: python3 scripts/update_books.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update currently reading" README.md
          git push
